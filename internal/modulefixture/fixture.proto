syntax = "proto3";
package agentwow.fixture.v1;
option go_package = "github.com/hazim-j/agent-wow/internal/modulefixture/api;fixturev1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message Request {
  uint64 number = 1;
  bytes payload = 2;
  uint32 opcode = 3;
  string failure = 4;
  uint32 delay_ms = 5;
}
message Result {
  uint64 number = 1;
  bytes payload = 2;
  uint32 client_time_ms = 3;
  uint32 packets = 4;
}
service Fixture {
  rpc Execute(Request) returns (Result);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
